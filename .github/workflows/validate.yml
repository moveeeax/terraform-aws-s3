name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # fmt/validate runs on OpenTofu to keep the module usable from both CLIs.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: fmt
        run: tofu fmt -check -recursive

      - name: init
        run: tofu init -backend=false

      - name: validate
        run: tofu validate

      - name: validate example
        working-directory: examples/basic
        run: |
          tofu init -backend=false
          tofu validate

  # The .tftest.hcl suite uses `mock_provider`, so it runs on Terraform 1.7+
  # and needs no AWS credentials.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false

      - name: init
        run: terraform init -backend=false

      - name: test
        run: terraform test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      # --recursive re-reads config per directory, so point every pass at the
      # repo-root .tflint.hcl explicitly.
      - name: tflint
        env:
          TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl
        run: tflint --recursive
